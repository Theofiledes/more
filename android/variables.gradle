ext {
    minSdkVersion = 23
    // compileSdk 36 while targetSdk stays 35 — deliberately split.
    // @capgo/capacitor-updater pulls okhttp-android 5.4.0, whose AAR metadata refuses to
    // link against anything below API 36, so the build fails outright on 35. Raising
    // compileSdk only lets us compile against the newer APIs; raising targetSdk is what
    // opts the app into new runtime behaviour, and that is a separate decision with its
    // own testing, so it is left alone.
    compileSdkVersion = 36
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}