name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 22, matching .nvmrc, lint.yml and release.yml. This said 18, which fails
          # before it ever reaches Android: vite's rolldown imports styleText from
          # node:util, added in 20.12, so `npm run build` dies with "does not provide
          # an export named 'styleText'". Capacitor 8's CLI wants >=22 regardless.
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy 'tools' package, which cmdline-tools 16
          # no longer has, so the step dies before the build starts. Gradle fetches the rest.
          packages: 'platform-tools'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Capacitor Copy & Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: more-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
