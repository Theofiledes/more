name: Lint

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint
